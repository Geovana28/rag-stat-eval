[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-stat-eval"
version = "1.0.0"
description = "Rigorous Statistical Validation and Robustness Auditing Suite for Retrieval-Augmented Generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Geovana Silva"}
]
keywords = ["rag", "statistical-tests", "mcnemar", "bootstrap", "calibration", "ece"]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["."]

